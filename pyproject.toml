[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-harmonica-studio"
version = "0.1.0"
description = "Offline MIDI-to-harmonica timeline and SteelSeries GG event converter"
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
audio = ["librosa>=0.11,<2"]

[project.scripts]
dhs = "dhs.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
